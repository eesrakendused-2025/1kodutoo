<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kohandatav Lauakell</title>
    <link rel="stylesheet" href="clock.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <script defer src="clock.js"></script>
</head>
<body>
    <div class="container">
        <h1>Kerli Viitmaa</h1>
        <div id="clock"></div>
        <div id="date"></div>
        <div class="controls">
            <button id="change-bg">Muuda tausta</button>
            <button id="change-font">Muuda fonti</button>
            <button id="change-color">Muuda kella värvi</button>
            <button id="toggle-format">Vaheta 12/24 tunni formaati</button>
            <button id="change-font-size">Muuda fondi suurust</button>
            <button id="fullscreen">Täisekraan</button>

        </div>
    </div>
    <footer>
        <a href="https://github.com/kerli5">Vaata GitHubis</a>
    </footer>
</body>
</html>
